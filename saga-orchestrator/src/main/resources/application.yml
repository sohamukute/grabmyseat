spring:
  application:
    name: saga-orchestrator
  datasource:
    url: ${SAGA_ORCHESTRATOR_POSTGRES_URL:jdbc:postgresql://localhost:5442/grabmyseat_saga}
    username: ${POSTGRES_USER:grabmyseat}
    password: ${POSTGRES_PASSWORD:grabmyseat}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8084
  tomcat:
    threads:
      # WalletClient/InventoryClient block() a Tomcat worker thread for the
      # full duration of each downstream call (up to the 5s WebClient
      # timeout) - the default 200-thread pool starves under a real
      # concurrent burst long before wallet itself is the bottleneck.
      max: 400
      min-spare: 50
    accept-count: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        slow-call-rate-threshold: 80
        # 2s/window-of-10 was too tight: a short burst of legitimately-slow
        # (not failed) calls during a real flash-sale spike tripped the
        # breaker and blocked everyone for the wait-duration, worse than not
        # having a breaker at all. Wider window + longer threshold means one
        # bad cluster of calls needs to be sustained, not a blip, to trip it.
        slow-call-duration-threshold: 3s
        permitted-number-of-calls-in-half-open-state: 10
        sliding-window-size: 20
    instances:
      inventory:
        base-config: default
      wallet:
        base-config: default
      waiting-room:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
    instances:
      inventory:
        base-config: default
      wallet:
        base-config: default
      waiting-room:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
    instances:
      inventory:
        base-config: default
      wallet:
        base-config: default
      waiting-room:
        base-config: default

inventory:
  uri: ${INVENTORY_URI:http://localhost:8082}

wallet:
  uri: ${WALLET_URI:http://localhost:8083}
  internal:
    api-key: ${WALLET_INTERNAL_API_KEY:change-me}

saga:
  timeout-seconds: ${SAGA_TIMEOUT_SECONDS:30}
  sweep-interval-ms: ${SAGA_SWEEP_INTERVAL_MS:60000}

waiting-room:
  uri: ${WAITING_ROOM_URI:http://localhost:8085}
  internal:
    api-key: ${WAITING_ROOM_INTERNAL_API_KEY:}

ticketing:
  uri: ${TICKETING_URI:[REDACTED-URL]}
  internal:
    api-key: ${TICKETING_INTERNAL_API_KEY:}
