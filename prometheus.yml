global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway:8080']
  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth-service:8081']
  - job_name: 'inventory-booking'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['inventory-booking:8082']
  - job_name: 'payment-wallet'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['payment-wallet:8083']
  - job_name: 'saga-orchestrator'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['saga-orchestrator:8084']
  - job_name: 'waiting-room'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['waiting-room:8085']
  - job_name: 'ticketing'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['ticketing:8085']
