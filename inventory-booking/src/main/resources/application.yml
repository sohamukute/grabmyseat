spring:
  application:
    name: inventory-booking
  datasource:
    url: ${INVENTORY_BOOKING_POSTGRES_URL:jdbc:postgresql://localhost:5442/grabmyseat_inventory}
    username: ${POSTGRES_USER:grabmyseat}
    password: ${POSTGRES_PASSWORD:grabmyseat}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:25}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/inventory-booking
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8082
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /api/inventory/v3/api-docs
  swagger-ui:
    path: /api/inventory/swagger-ui.html

waiting-room:
  uri: ${WAITING_ROOM_URI:http://localhost:8085}
  internal:
    api-key: ${WAITING_ROOM_INTERNAL_API_KEY:}

auth-service:
  uri: ${AUTH_SERVICE_URI:http://localhost:8081}
  internal:
    api-key: ${AUTH_INTERNAL_API_KEY:}

inventory-booking:
  internal:
    api-key: ${INVENTORY_BOOKING_INTERNAL_API_KEY:}

poster:
  upload-dir: ${POSTER_UPLOAD_DIR:uploads}
