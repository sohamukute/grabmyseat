spring:
  application:
    name: ticketing
  datasource:
    url: ${TICKETING_POSTGRES_URL:jdbc:postgresql://localhost:5443/grabmyseat_ticketing}
    username: ${POSTGRES_USER:grabmyseat}
    password: ${POSTGRES_PASSWORD:grabmyseat}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /api/ticketing/v3/api-docs
  swagger-ui:
    path: /api/ticketing/swagger-ui.html

ticketing:
  internal:
    api-key: ${TICKETING_INTERNAL_API_KEY:}

inventory-booking:
  uri: ${INVENTORY_BOOKING_URI:http://localhost:8082}
  internal:
    api-key: ${INVENTORY_BOOKING_INTERNAL_API_KEY:}

staff-assignment:
  cache:
    ttl-seconds: 30
    max-size: 10000

ticket:
  signing-key: ${TICKET_SIGNING_KEY:change-me}
