spring:
  application:
    name: payment-wallet
  datasource:
    url: ${PAYMENT_WALLET_POSTGRES_URL:jdbc:postgresql://localhost:5442/grabmyseat_wallet}
    username: ${POSTGRES_USER:grabmyseat}
    password: ${POSTGRES_PASSWORD:grabmyseat}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:40}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8083
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /api/wallet/v3/api-docs
  swagger-ui:
    path: /api/wallet/swagger-ui.html

wallet:
  internal:
    api-key: ${WALLET_INTERNAL_API_KEY:change-me}
