services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: "grabmyseat"
      POSTGRES_PASSWORD: "grabmyseat"
      POSTGRES_DB: "grabmyseat"
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grabmyseat"]
      interval: 5s
      timeout: 3s
      retries: 10

  mail:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_URL: "jdbc:postgresql://postgres:5432/grabmyseat"
      DB_USER: "grabmyseat"
      DB_PASSWORD: "grabmyseat"
      MAIL_HOST: "mail"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
