spring:
  application:
    name: waiting-room
  datasource:
    url: ${WAITING_ROOM_POSTGRES_URL:jdbc:postgresql://localhost:5442/grabmyseat_waiting_room}
    username: ${POSTGRES_USER:grabmyseat}
    password: ${POSTGRES_PASSWORD:grabmyseat}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/waiting-room
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /api/waiting-room/v3/api-docs
  swagger-ui:
    path: /api/waiting-room/swagger-ui.html

waiting-room:
  internal:
    api-key: ${WAITING_ROOM_INTERNAL_API_KEY:change-me}
  admission-rate-per-second: ${ADMISSION_RATE:10}
  offer-ttl-minutes: ${OFFER_TTL_MINUTES:5}
  queue-token-ttl-hours: ${QUEUE_TOKEN_TTL_HOURS:2}
  permit-ttl-minutes: ${PERMIT_TTL_MINUTES:10}

inventory:
  uri: ${INVENTORY_URI:http://localhost:8082}
